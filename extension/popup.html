<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252525;background:#f7f7f7;font-synthesis:none}
*{box-sizing:border-box}
body{width:316px;margin:0;padding:20px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#262626;color:#f7f7f7}
.brand{font-size:14px;font-weight:600;letter-spacing:.01em}
.eyebrow{margin:0 0 5px;color:#777;font-size:11px}
h1{margin:0;font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.02em}
.description{margin:8px 0 20px;color:#626262;font-size:12px;line-height:1.55}
label{display:block;margin:0 0 7px;font-size:12px;font-weight:500}
input{width:100%;height:40px;padding:0 11px;border:1px solid #d2d2d2;border-radius:8px;background:#fff;color:inherit;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid #818181;outline-offset:2px}
input[aria-invalid="true"]{border-color:#ad554c}
button{width:100%;height:40px;margin-top:10px;border:0;border-radius:8px;background:#262626;color:#fff;font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
button:hover:not(:disabled){background:#424242}button:disabled{opacity:.55;cursor:default}
.status{display:none;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#eaeaea;color:#404040;font-size:12px;line-height:1.45}
.status[data-state="error"]{background:#f5e9e8;color:#8e413b}
.status:not(:empty){display:block}
.footer{margin:18px 0 0;padding-top:14px;border-top:1px solid #e6e6e6;color:#777;font-size:11px;line-height:1.45}
@media(prefers-color-scheme:dark){:root{color:#ededed;background:#222}.mark{background:#eaeaea;color:#222}.eyebrow,.footer{color:#9c9c9c}.description{color:#b0b0b0}input{background:#2c2c2c;border-color:#525252}button{background:#e9e9e9;color:#202020}button:hover:not(:disabled){background:#fff}.status{background:#333;color:#ddd}.status[data-state="error"]{background:#49312f;color:#f0b5ad}.footer{border-color:#3b3b3b}}
</style>
</head>
<body>
<header class="header"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4h14l-5.6 6.3V16l-2.8-1.3v-4.4L3 4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span><span class="brand">Folio</span></header>
<main>
<p class="eyebrow" id="eyebrow"></p>
<h1 id="title"></h1>
<p class="description" id="instructions"></p>
<form id="form">
<label for="code" id="code-label"></label>
<input id="code" type="text" autocomplete="off" spellcheck="false" aria-describedby="status" required>
<button id="connect" type="submit"></button>
<p class="status" id="status" role="status" aria-live="polite"></p>
</form>
<p class="footer" id="footer"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
